name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Build, Test & Pack Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify package contents
        run: |
          output=$(npm pack --dry-run 2>&1)
          echo "$output"
          echo "$output" | grep -q 'dist/index\.js' || { echo "Error: dist/index.js is missing from package contents" >&2; exit 1; }
